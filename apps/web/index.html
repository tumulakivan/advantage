<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#16181b" />
    <meta
      name="description"
      content="adVantage - a budget tracker for people who would rather not pay a subscription for a spreadsheet."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>adVantage</title>
    <script>
      // Dark is the default. Read the stored choice before first paint so a
      // light-mode user never sees a graphite flash.
      try {
        var stored = localStorage.getItem("advantage.theme");
        document.documentElement.classList.toggle("dark", stored !== "light");
      } catch (error) {
        document.documentElement.classList.add("dark");
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
